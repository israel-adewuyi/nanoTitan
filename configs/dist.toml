run_name = "cuda_backend"
max_steps = 20

[model]
vocab_size = 50257
d_model = 128
max_seq_len = 512
n_layers = 8
d_head = 16
n_heads = 8
ffn_in = 512
num_experts = 16
top_k = 2
router_alpha = 0.01
moe_backend = "cuda"
dtype = "float32"

[trainer]
seed = 42
eval_every_step = -1
per_device_batch_size = 16
grad_norm = 2

[data]
dataset_name = "roneneldan/TinyStories"
num_workers = 1

[optim]
type = "adam"
lr = "1e-3"

[runtime]
num_microbatches = 1
pipeline_schedule = "gpipe"
dp_size = 1
pp_size = 1
ep_size = 1

[profiler]
enabled = false
wait_steps = 2
warmup_steps = 2
active_steps = 2
record_shapes = true
profile_memory = true
with_stack = false
with_flops = false

[hardware]
peak_flops_tflops_per_gpu = 312.0
