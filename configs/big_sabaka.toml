run_name = "GPU=1_DP_BS=20"
max_steps = 200

[model]
vocab_size = 50257
d_model = 512
max_seq_len = 512
n_layers = 16
d_head = 64
n_heads = 8
ffn_in = 2048
num_experts = 20
top_k = 2
router_alpha = 0.01
capacity_factor = 1.25
moe_backend = "cuda"
dtype = "bfloat16"
moe_bias_coef = 0.001

[trainer]
seed = 42
grad_norm = 2
val_interval = -1
num_val_batches = 10
per_device_batch_size = 20

[data]
dataset_name = "roneneldan/TinyStories"
dataset_path = "data/tinystories_seq512.pt"

[optim]
type = "adam"
lr = "5e-4"

[runtime]
num_microbatches = 1
pipeline_schedule = "gpipe"
activation_checkpointing = false
bucket_size = 64
dp_size = 1
pp_size = 1
ep_size = 1

[profiler]
enabled = false
wait_steps = 50
warmup_steps = 10
active_steps = 5
record_shapes = true
profile_memory = true
with_stack = false
with_flops = false

[hardware]
peak_flops_tflops_per_gpu = 312.0
